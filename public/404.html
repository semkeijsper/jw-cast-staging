<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>JW Cast</title>
    <!--
      GitHub Pages SPA fallback.
      Encodes the full path into a redirect query param so the SPA router
      can restore it. Based on https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var l = window.location;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 1).join('/') + '/?p=/' + l.pathname.slice(1).split('/').join('/').replace(/&/g, '~and~') + (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
    </script>
  </head>
  <body></body>
</html>
